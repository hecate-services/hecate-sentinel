name: lint-and-test
# A push on any branch runs these checks, so a CI change can be proven on a
# branch before it reaches main. This job builds no image: build-push.yml
# stays on main and tags only.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: erlang:27
    steps:
      - uses: actions/checkout@v4
      # hecate_om 0.15.0 made barrel_docdb (RocksDB-backed) a hard
      # dependency -- its erocksdb NIF needs cmake + a C++ toolchain to
      # build, neither of which the base erlang:27 image ships. Without
      # this, rebar3 lint/eunit fail at "cmake: not found" the moment any
      # dependency on hecate_om >= 0.15 lands here.
      - name: Install native build toolchain (RocksDB via barrel_docdb)
        run: apt-get update && apt-get install -y cmake build-essential curl
      # macula's NIFs other than QUIC always build from source, and
      # macula_cbor_nif's compile hook fails without cargo rather than skip.
      # Same step as hecate-om's service template.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rebar3 lint
      - run: rebar3 eunit
